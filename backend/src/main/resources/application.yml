server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend
  # Nạp file .env từ thư mục gốc hoặc thư mục backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  # 1. Kết nối DB với giá trị mặc định (Fallback)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/house_moving_system_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  # 2. JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 3. Định dạng thời gian
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  # 4. Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
